<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Temple of Montezuma</title>
    <style>
        body {
            background-color: #1a110a;
            color: #d4af37;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            user-select: none;
        }
        h1 {
            margin: 5px 0;
            font-size: 24px;
            letter-spacing: 2px;
            text-shadow: 2px 2px #000;
        }
        #game-container {
            position: relative;
            display: inline-block;
            border: 4px solid #8b5a2b;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            background: #2b1d0c;
            cursor: crosshair;
        }
        canvas {
            display: block;
            background: #2b1d0c;
        }
        #ui {
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
        }
        .instructions {
            font-size: 11px;
            color: #a08060;
            margin-top: 6px;
        }
        #audio-btn {
            margin-top: 8px;
            background: #8b5a2b;
            color: #ffd700;
            border: 2px solid #d4af37;
            padding: 6px 14px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>TEMPLE OF MONTEZUMA</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>
    <div id="ui">Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
    <div><button id="audio-btn">🎻 ENABLE ORCHESTRAL SCORE</button></div>
    <div class="instructions"><b>A/D or Left/Right</b> to Run | <b>W/S or Up/Down</b> to Jump / Reel Rope | <b>Click</b> to Grapple & Swing | <b>Space</b> to Detach | <b>Enter</b> to Restart</div>

<script>
window.onload = function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let lives = 3;
    let gameState = 'playing';
    let cameraX = 0;
    const worldWidth = 2800;

    let audioCtx = null;
    let musicInterval = null;
    let scoreIndex = 0;
    const orchestralBass = [130.81, 130.81, 164.81, 196.00, 130.81, 110.00, 130.81, 146.83];
    const orchestralHorns = [261.63, 329.63, 392.00, 523.25, 493.88, 392.00, 329.63, 440.00];

    document.getElementById('audio-btn').onclick = function() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (!musicInterval) {
            musicInterval = setInterval(() => {
                if (!audioCtx || gameState !== 'playing') return;
                const now = audioCtx.currentTime;
                try {
                    const bass = audioCtx.createOscillator();
                    const bGain = audioCtx.createGain();
                    bass.type = 'triangle';
                    bass.frequency.setValueAtTime(orchestralBass[scoreIndex % orchestralBass.length], now);
                    bGain.gain.setValueAtTime(0.06, now);
                    bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    bass.connect(bGain);
                    bGain.connect(audioCtx.destination);
                    bass.start(now); bass.stop(now + 0.4);

                    const horn = audioCtx.createOscillator();
                    const hGain = audioCtx.createGain();
                    horn.type = 'sawtooth';
                    horn.frequency.setValueAtTime(orchestralHorns[scoreIndex % orchestralHorns.length], now);
                    hGain.gain.setValueAtTime(0.03, now);
                    hGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    horn.connect(hGain);
                    hGain.connect(audioCtx.destination);
                    horn.start(now); horn.stop(now + 0.35);

                    scoreIndex++;
                } catch(e){}
            }, 300);
            this.innerText = '🎻 ORCHESTRAL SCORE ON';
        } else {
            clearInterval(musicInterval);
            musicInterval = null;
            this.innerText = '🔇 ORCHESTRAL SCORE OFF';
        }
    };

    let player = {
        x: 100, y: 250, width: 24, height: 34,
        vx: 0, vy: 0, speed: 4.5, jumpPower: -10,
        gravity: 0.5, grounded: false, canDoubleJump: false,
        isGrappling: false, grappleX: 0, grappleY: 0, ropeLength: 0
    };

    const platforms = [
        {x: 0, y: 390, width: 500, height: 60},
        {x: 580, y: 320, width: 140, height: 20},
        {x: 780, y: 260, width: 160, height: 20},
        {x: 1020, y: 390, width: 350, height: 60},
        {x: 1450, y: 300, width: 150, height: 20},
        {x: 1700, y: 230, width: 180, height: 20},
        {x: 1980, y: 390, width: 820, height: 60}
    ];

    const hazards = [
        {x: 500, y: 410, width: 80, height: 40},
        {x: 970, y: 410, width: 50, height: 40},
        {x: 1400, y: 410, width: 50, height: 40},
        {x: 1900, y: 410, width: 80, height: 40}
    ];

    let relics = [
        {x: 640, y: 270, width: 20, height: 20, collected: false},
        {x: 850, y: 210, width: 20, height: 20, collected: false},
        {x: 1510, y: 250, width: 20, height: 20, collected: false}
    ];

    let finalSun = { x: 2500, y: 320, width: 32, height: 32, collected: false };
    let exitGate = { x: 2560, y: 310, width: 45, height: 80, active: false };

    let keys = {};
    window.onkeydown = function(e) {
        keys[e.key] = true;
        if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
            if (gameState === 'playing') {
                if (player.isGrappling) {
                    player.isGrappling = false;
                    player.vy = -6;
                } else if (player.grounded) {
                    player.vy = player.jumpPower;
                    player.grounded = false;
                    player.canDoubleJump = true;
                } else if (player.canDoubleJump) {
                    player.vy = player.jumpPower * 0.9;
                    player.canDoubleJump = false;
                }
            }
        }
        if (e.key === 'Enter' && gameState !== 'playing') {
            score = 0; lives = 3; gameState = 'playing';
            player.x = 100; player.y = 250; player.vx = 0; player.vy = 0; player.isGrappling = false;
            relics.forEach(r => r.collected = false);
            finalSun.collected = false; exitGate.active = false;
        }
    };
    window.onkeyup = function(e) { keys[e.key] = false; };

    canvas.onmousedown = function(e) {
        if (gameState !== 'playing') return;
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left + cameraX;
