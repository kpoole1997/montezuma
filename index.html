<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple of Montezuma</title>
    <style>
        body {
            background-color: #1a120b;
            color: #e6d5bc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            color: #d4af37;
            text-shadow: 2px 2px #000;
        }
        #game-container {
            position: relative;
            border: 4px solid #8c6239;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background: #2c1d11;
        }
        canvas {
            display: block;
            background: #110b07;
        }
        .ui-bar {
            margin-top: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .controls-hint {
            margin-top: 6px;
            font-size: 0.85rem;
            color: #a89378;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>TEMPLE OF MONTEZUMA</h1>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>

    <div class="ui-bar">
        Score: <span id="scoreVal">0</span> | Lives: <span id="livesVal">3</span>
    </div>
    
    <div class="controls-hint">
        <strong>A / D</strong> to Run | <strong>W</strong> to Jump | <strong>Click</strong> to Grapple | <strong>Enter</strong> to Restart
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let lives = 3;
        let gameState = 'PLAYING';

        const keys = { left: false, right: false, up: false };
        let activeGrapple = null;

        window.addEventListener('keydown', e => {
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
            if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') keys.up = true;
            if (e.code === 'Enter' && gameState === 'GAMEOVER') resetGame();
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
            if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') {
                keys.up = false;
                activeGrapple = null; // Release grapple
            }
        });

        canvas.addEventListener('mousedown', e => {
            if (gameState === 'PLAYING') {
                const rect = canvas.getBoundingClientRect();
                activeGrapple = {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }
        });

        let player = {
            x: 100,
            y: 300,
            vx: 0,
            vy: 0,
            width: 24,
            height: 36,
            speed: 4,
            jumpPower: -8.5,
            gravity: 0.4,
            grounded: false
        };

        const platforms = [
            { x: 0, y: 410, w: 800, h: 40 }, // Ground
            { x: 150, y: 310, w: 120, h: 20 },
            { x: 340, y: 230, w: 140, h: 20 },
            { x: 560, y: 160, w: 150, h: 20 },
            { x: 200, y: 130, w: 100, h: 20 }
        ];

        function resetGame() {
            score = 0;
            lives = 3;
            gameState = 'PLAYING';
            player.x = 50;
            player.y = 350;
            player.vx = 0;
            player.vy = 0;
            activeGrapple = null;
            updateUI();
        }

        function updateUI() {
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('livesVal').innerText = lives;
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            // Horizontal Movement
            if (keys.left) player.vx = -player.speed;
            else if (keys.right) player.vx = player.speed;
            else player.vx *= 0.8;

            // Jumping
            if (keys.up && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
            }

            // Grappling Physics Pull
            if (activeGrapple) {
                let dx = activeGrapple.x - (player.x + player.width / 2);
                let dy = activeGrapple.y - player.y;
                player.vx += dx * 0.01;
                player.vy += dy * 0.01;
            }

            // Gravity & Position Updates
            player.vy += player.gravity;
            player.x += player.vx;
            player.y += player.vy;

            // Platform Collision
            player.grounded = false;
            platforms.forEach(plat => {
                if (player.x + player.width > plat.x && 
                    player.x < plat.x + plat.w &&
                    player.y + player.height >= plat.y && 
                    player.y + player.height <= plat.y + 15 && 
                    player.vy >= 0) {
                    player.y = plat.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            });

            // Boundaries & Pit Falls
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
            if (player.y > canvas.height + 50) {
                lives--;
                updateUI();
                if (lives <= 0) {
                    gameState = 'GAMEOVER';
                } else {
                    player.x = 50;
                    player.y = 200;
                    player.vx = 0;
                    player.vy = 0;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Platforms
            platforms.forEach(plat => {
                ctx.fillStyle = '#614124';
                ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 2;
                ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
            });

            // Draw Grapple Line
            if (activeGrapple) {
                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(player.x + player.width / 2, player.y + player.height / 2);
                ctx.lineTo(activeGrapple.x, activeGrapple.y);
                ctx.stroke();
            }

            // Draw Player
            ctx.fillStyle = '#d97736';
            ctx.fillRect(player.x, player.y + 10, player.width, player.height - 10);
            ctx.fillStyle = '#deb887';
            ctx.fillRect(player.x + 4, player.y, 16, 12);

            // Game Over Screen
            if (gameState === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff4d4d';
                ctx.font = 'bold 28px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 15);
                ctx.fillStyle = '#e6d5bc';
                ctx.font = '16px Courier New';
                ctx.fillText('Press [ENTER] to Restart', canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        resetGame();
        loop();
    </script>
</body>
</html>
